.note{text-align:center;font-size:.8rem;color:var(--mut);border:1px dashed var(--line);border-radius:10px;padding:6px 12px;max-width:520px;margin:16px auto}
.hero .wrap{grid-template-columns:minmax(0,1fr)!important}.hero .wrap>*{min-width:0;max-width:100%}.hero p{max-width:min(46ch,100%)}
.hero .art{width:min(100%,460px);gap:3%}.hero .art .fb{flex:none}.hero .art .f1{width:27.6%}.hero .art .f2{width:32.4%}.hero .art .f3{width:30.0%}
.hero .wrap{position:relative;z-index:1}
.hlogo{display:block;width:96px;height:96px;margin:0 auto 14px;border-radius:50%;box-shadow:0 0 0 1px #c9a24b88,0 0 30px #c9a24b44;animation:pop .8s both}
.is-home header .logo img{display:none}
.ib.ig:hover{color:var(--gs)}
#menu .mf{flex-wrap:wrap}
.row.soc{justify-content:center}
.ib.lb{flex-direction:column;display:flex;align-items:center;justify-content:center;gap:2px;width:auto;min-width:48px;padding:0 4px;height:50px;line-height:1}
.ib.lb .t{font:500 .62rem/1 'IBM Plex Sans Arabic',Tahoma,sans-serif;color:var(--mut);white-space:nowrap}
.ib.lb:hover .t{color:var(--gs)}
.ib.lb svg{width:22px;height:22px}#mo.lb .bot{width:26px;height:26px}
.fb{position:relative}.fb img{position:relative;z-index:1}
.fb .stm{position:absolute;left:44.5%;top:25%;width:11%;aspect-ratio:1;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,252,240,.9) 0,rgba(255,252,240,.5) 34%,rgba(255,252,240,0) 70%);animation:stA 6s linear infinite;animation-delay:calc(var(--i)*-.43s);will-change:transform,opacity}
.fb .stm.b{animation-name:stB}
@keyframes stA{0%{transform:translate(0,0) scale(.45);opacity:0}10%{opacity:.85}25%{transform:translate(-45%,-80%) scale(.8)}50%{transform:translate(55%,-170%) scale(1.25);opacity:.6}75%{transform:translate(-50%,-250%) scale(1.7);opacity:.3}100%{transform:translate(15%,-320%) scale(2.2);opacity:0}}
@keyframes stB{0%{transform:translate(0,0) scale(.45);opacity:0}10%{opacity:.85}25%{transform:translate(45%,-80%) scale(.8)}50%{transform:translate(-55%,-170%) scale(1.25);opacity:.6}75%{transform:translate(50%,-250%) scale(1.7);opacity:.3}100%{transform:translate(-15%,-320%) scale(2.2);opacity:0}}
.ib.lb .cnt{top:0;inset-inline-start:8px}.cnt[hidden]{display:none}
.hero .art{gap:2.5%;margin-top:34px}.hero .art .f1{width:28%}.hero .art .f2{width:38%}.hero .art .f3{width:29%}</style>

<label for="ct">الدولة</label><select id="ct"><option>مصر</option><option>السودان</option></select>
<label for="st">المحافظة / الولاية</label><input id="st" required><div class="er" data-e="st"></div>
<label for="cy">المدينة</label><input id="cy" required><div class="er" data-e="cy"></div>
<label for="ad">العنوان بالتفصيل</label><textarea id="ad" required></textarea><div class="er" data-e="ad"></div>
<label for="nt">ملاحظات إضافية</label><textarea id="nt"></textarea><div class="er" id="fe" role="alert"></div><button class="btn" style="width:100%" id="cb">تأكيد الطلب</button></form>
<div class="box"><h3>ملخص الطلب</h3>${cart.map(i=>{const p=byI(i.id);return `<div class="tl"><span>${p.name} × ${i.q}</span><span>${money(p.price*i.q)}</span></div>`}).join('')}<div class="tl"><span>المجموع الفرعي</span><span>${money(sub())}</span></div><div class="tl"><span>التوصيل</span><span style="font-size:.8rem;text-align:left">يُؤكَّد بعد الإرسال</span></div><div class="tl t"><span>الإجمالي</span><span>${money(sub())}</span></div><p style="font-size:.82rem;color:var(--mut)">سيتم تأكيد تكلفة التوصيل مع العميل بعد إرسال الطلب.</p></div></div></div>`},
done:id=>{const o=ld('alj_last',null);if(!o||o.id!==id)return V.nf('الطلب غير موجود');return `<div class="wrap"><div class="ok"><div class="mk">✓</div><h1>تم استلام طلبك بنجاح</h1><p>شكرًا لطلبك من الجيلاني للعطور.</p><div class="box"><div style="color:var(--mut)">رقم الطلب</div><b style="font-size:1.4rem">${o.id}</b></div><p>وسيتواصل معك فريق الجيلاني لتأكيد تفاصيل الطلب والتوصيل.</p><div class="row" style="justify-content:center"><a class="btn" href="#/">العودة إلى المتجر</a><a class="btn o" href="#/shop">متابعة التسوق</a><a class="btn o" target="_blank" rel="noopener" href="${wa('مرحبًا، أود الاستفسار عن الطلب رقم '+o.id+'.')}">التواصل عبر واتساب</a></div></div></div>`},
about:()=>`<div class="wrap lg">${crumb('من نحن')}<h1 class="ph">من نحن</h1><p style="text-align:center;max-width:62ch;margin:0 auto 20px">الجيلاني للعطور — محلكم السوداني في مصر. متجر يجمع بين العطور والمنتجات السودانية ومنتجات العناية، مع فرعين في القاهرة: الدقي ومدينة نصر.</p>${NOTE}${secs([['هويتنا','نص تعريفي عن هوية المتجر وجذوره السودانية وحضوره في مصر.'],['ما نقدّمه','عطور رجالية ونسائية وللجنسين، ومنتجات سودانية تراثية، والطلح والصندل والحنة، ومنتجات العناية والكريمات.'],['خدمة العملاء','نص عن طريقة خدمة العملاء وأوقات الرد.'],['التزامنا','نص عن معايير اختيار المنتجات والجودة.']])}<h2>فروعنا</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">${CONFIG.BRANCHES.map(brBox).join('')}</div><div style="text-align:center;margin:26px 0"><a class="btn" href="#/shop">تصفح المتجر</a></div></div>`,
contact:()=>`<div class="wrap">${crumb('تواصل معنا')}<h1 class="ph">تواصل معنا</h1><p style="text-align:center;color:var(--mut)">يسعدنا تواصلكم في أي وقت.</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:20px">${CONFIG.BRANCHES.map(brBox).join('')}<div class="box"><h3>الهاتف</h3><p dir="ltr" style="text-align:right">${CONFIG.STORE_PHONE}</p><a class="btn sm" href="tel:${CONFIG.STORE_PHONE}">اتصل بنا</a></div><div class="box"><h3>واتساب</h3><p dir="ltr" style="text-align:right">${CONFIG.WHATSAPP_DISPLAY}</p><a class="btn sm" target="_blank" rel="noopener" href="${wa('مرحبًا')}">راسلنا</a></div><div class="box"><h3>ساعات العمل</h3><p>سيتم إضافة مواعيد العمل هنا.</p></div><div class="box"><h3>تيك توك</h3><p>تابعنا لمعرفة جديدنا.</p><a class="btn sm" href="${TK}" target="_blank" rel="noopener">${tkI} تابعنا</a></div><div class="box"><h3>إنستغرام</h3><p>تابعنا لمعرفة جديدنا.</p><a class="btn sm" href="${IG}" target="_blank" rel="noopener">${igI} تابعنا</a></div></div><div class="two" style="margin-top:28px"><form id="cm" class="box f"><h3>أرسل لنا رسالة</h3><label for="mn">الاسم</label><input id="mn" required><label for="mm">رسالتك</label><textarea id="mm" required></textarea><button class="btn" style="width:100%;margin-top:12px">إرسال عبر واتساب</button></form><div class="box" style="display:grid;place-items:center;min-height:220px;text-align:center;color:var(--mut)">مساحة الخريطة — تُضاف عند اعتماد الموقع.</div></div>${NOTE}</div>`,
faq:()=>`<div class="wrap">${crumb('الأسئلة الشائعة')}<h1 class="ph">الأسئلة الشائعة</h1>${NOTE}${FAQ.map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}</div>`,
legal:s=>{const l=LEGAL[s];return l?`<div class="wrap lg">${crumb(l[0])}<h1 class="ph">${l[0]}</h1><p style="text-align:center;color:var(--mut)">${l[1]}</p>${NOTE}${secs(l[2])}</div>`:V.nf()},
nf:m=>`<div class="wrap empty"><h2>${m||'عذرًا، لم نجد الصفحة التي تبحث عنها.'}</h2><a class="btn" href="#/">العودة إلى المتجر</a></div>`};
document.addEventListener('submit',e=>{if(e.target.id!=='cm')return;e.preventDefault();open(wa('مرحبًا، أنا '+$('#mn').value.trim()+'\n'+$('#mm').value.trim()),'_blank')});
/* ===== ROUTER ===== */
function filt(){const q=$('#fq').value,c=$('#fc').value,s=$('#fs').value,m=+$('#fp').value;let l=(q?find(q):PRODUCTS).filter(p=>(!c||p.cat===c)&&(!m||p.price<=m)&&(!R.ofr||p.old));l=[...l].sort((a,b)=>s==='a'?a.price-b.price:s==='d'?b.price-a.price:s==='b'?(b.best||0)-(a.best||0):(b.isNew||0)-(a.isNew||0)||b.id-a.id);$('#fl').innerHTML=grid(l);rv()}
const io='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.1}):null;
function rv(){document.querySelectorAll('.card,.cat,.box,.step,section h2,details,.trust div,.band').forEach(el=>{if(el.classList.contains('rv'))return;el.classList.add('rv');io?io.observe(el):el.classList.add('in')})}
let R={};
function render(){const [,r,a]=ROUTE.split('/');R={ofr:r==='offers'};let h;
if(!r)h=V.home();else if(r==='shop'||r==='offers')h=V.shop('',R.ofr);else if(r==='category')h=cat(a)?V.shop(a):V.nf();else if(r==='product')h=V.product(a);else if(V[r]&&['cart','wishlist','checkout','about','contact','faq'].includes(r))h=V[r]();else if(r==='confirmation')h=V.done(a);else if(LEGAL[r])h=V.legal(r);else h=V.nf();
$('#app').innerHTML=h;document.body.classList.toggle('is-home',!r);setMenu(false);window.scrollTo(0,0);if($('#fl'))filt();rv();
document.title=(r==='product'&&byS(a)?byS(a).name+' — ':'')+CONFIG.STORE_NAME;save()}
let ROUTE=(location.hash||'#/').slice(1)||'/';
function nav(h){ROUTE=h.replace(/^#/,'')||'/';try{history.pushState(null,'','#'+ROUTE)}catch(e){}render()}
const sync=()=>{ROUTE=(location.hash||'#/').slice(1)||'/';render()};addEventListener('hashchange',sync);addEventListener('popstate',sync);
document.addEventListener('click',e=>{const a=e.target.closest('a');if(!a||e.defaultPrevented||e.metaKey||e.ctrlKey)return;const h=a.getAttribute('href')||'';
if(h.startsWith('#/')){e.preventDefault();nav(h)}else if(a.target==='_blank'&&/^https?:/.test(h)){e.preventDefault();const w=window.open(h,'_blank');if(!w)location.href=h}});
/* ===== EVENTS ===== */
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
if(d.a)add(+d.a);else if(d.w){tw(+d.w);if(ROUTE.includes('wishlist'))render();else t.classList.toggle('on')}
else if(d.c){const i=cart.find(x=>x.id==d.c);i.q=Math.max(1,i.q+ +d.d);render()}else if(d.r){cart=cart.filter(x=>x.id!=d.r);render()}
else if(d.t!==undefined){const p=byS(ROUTE.split('/')[2]);$('#pm').innerHTML=img(p,+d.t);document.querySelectorAll('.th button').forEach(b=>b.classList.toggle('on',b===t))}
else if(d.q){const v=$('#qv');v.textContent=Math.max(1,+v.textContent+ +d.q)}
else if(t.id==='pa'||t.id==='pb'){const p=byS(ROUTE.split('/')[2]);add(p.id,+$('#qv').textContent,t.id==='pb');if(t.id==='pb')nav('#/checkout')}
else if(d.ap){add(+d.ap)}});
document.addEventListener('input',e=>{if(['fq','fc','fs','fp'].includes(e.target.id))filt()});
document.addEventListener('change',e=>{if(['fc','fs','fp'].includes(e.target.id))filt()});
document.addEventListener('submit',async e=>{if(e.target.id!=='co')return;e.preventDefault();let ok=true;const v=i=>$('#'+i).value.trim();
[['n','أدخل الاسم الكامل'],['ph','أدخل رقم هاتف صحيحًا'],['st','أدخل المحافظة أو الولاية'],['cy','أدخل المدينة'],['ad','أدخل العنوان بالتفصيل']].forEach(([i,m])=>{const bad=!v(i)||(i==='ph'&&!/^[+\d\s-]{8,16}$/.test(v(i)));document.querySelector(`[data-e=${i}]`).textContent=bad?m:'';if(bad)ok=false});
if(!ok)return;$('#cb').disabled=true;$('#cb').textContent='جارٍ الإرسال…';
const n=(ld('alj_n',0))+1;sv('alj_n',n);
const order={id:'ALJ-'+String(n).padStart(6,'0'),customer:v('n'),phone:v('ph'),country:$('#ct').value,state:v('st'),city:v('cy'),address:v('ad'),items:cart.map(i=>({name:byI(i.id).name,qty:i.q,price:byI(i.id).price})),subtotal:sub(),delivery:'يُؤكَّد مع العميل',total:sub(),notes:v('nt'),timestamp:new Date().toISOString()};
try{/* Production: POST order to GOOGLE_FORM_ENDPOINT and TELEGRAM_ENDPOINT (server holds the bot token). */
await new Promise(r=>setTimeout(r,700));sv('alj_last',order);cart=[];save();nav('#/confirmation/'+order.id)}catch(x){$('#fe').textContent='تعذّر إرسال الطلب. تحقق من الاتصال وحاول مجددًا.';$('#cb').disabled=false;$('#cb').textContent='تأكيد الطلب'}});
/* ===== CHROME ===== */
const NAV=[['الرئيسية','#/'],['المتجر','#/shop'],['العطور','#/category/perfumes'],['المنتجات السودانية','#/category/sudanese-products'],['العروض','#/offers'],['من نحن','#/about'],['تواصل معنا','#/contact']];
document.querySelector('nav.d').innerHTML=NAV.map(n=>`<a href="${n[1]}">${n[0]}</a>`).join('');
$('#menu').innerHTML=NAV.concat(CATS.slice(2).map(c=>[c.name,'#/category/'+c.slug]),[['الأسئلة الشائعة','#/faq']]).map((n,i)=>`<a href="${n[1]}" style="--i:${i}">${n[0]}</a>`).join('')+`<div class="mf"><img data-logo alt="" width="72" height="72"><a class="btn sm" href="${TK}" target="_blank" rel="noopener">${tkI} تيك توك</a><a class="btn sm" href="${IG}" target="_blank" rel="noopener">${igI} إنستغرام</a></div>`;
function setMenu(o){const m=$('#menu'),b=$('#mo');if(o)m.style.top=Math.max(0,$('header').getBoundingClientRect().bottom)+'px';m.classList.toggle('on',o);b.classList.toggle('open',o);b.setAttribute('aria-expanded',o)}
$('#mo').onclick=()=>setMenu(!$('#menu').classList.contains('on'));addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});
$('#ft').innerHTML=`<div><img data-logo alt="" width="84" height="84" style="border-radius:50%;margin-bottom:10px"><h3>${CONFIG.STORE_NAME}</h3><p>محلكم السوداني في مصر.</p></div><div><h3>المتجر</h3>${CATS.map(c=>`<a href="#/category/${c.slug}">${c.name}</a>`).join('')}<a href="#/offers">العروض</a></div><div><h3>خدمة العملاء</h3><a href="#/contact">تواصل معنا</a><a href="#/shipping">الشحن والتوصيل</a><a href="#/returns">الاستبدال والاسترجاع</a><a href="#/faq">الأسئلة الشائعة</a></div><div><h3>معلومات</h3><a href="#/about">من نحن</a><a href="#/privacy-policy">سياسة الخصوصية</a><a href="#/terms">الشروط والأحكام</a><a href="#/refund-policy">سياسة الاسترداد</a></div><div><h3>تواصل معنا</h3><p dir="ltr" style="text-align:right;margin:0">${CONFIG.STORE_PHONE}<br>${CONFIG.WHATSAPP_DISPLAY}</p>${CONFIG.BRANCHES.map(b=>`<p style="margin:6px 0">${b.name}: <a href="${mapUrl(b)}" target="_blank" rel="noopener" style="display:inline;text-decoration:underline">${b.addr}</a></p>`).join('')}</div>`;
$('#wa').href=wa('مرحبًا');$('#tk').href=TK;$('#ig').href=IG;$('#ft').lastElementChild.insertAdjacentHTML('beforeend',`<a href="${TK}" target="_blank" rel="noopener">تيك توك</a><a href="${IG}" target="_blank" rel="noopener">إنستغرام</a>`);
$('#sb').onclick=()=>{$('#so').classList.add('on');$('#si').focus()};$('#sx').onclick=()=>$('#so').classList.remove('on');
$('#si').oninput=e=>{const q=e.target.value;$('#sr').innerHTML=q.trim()?grid(find(q)).replace(/^<div class="grid">|<\/div>$/g,''):''};
$('#sr').onclick=e=>{if(e.target.closest('a'))$('#so').classList.remove('on')};
/* ===== ASSISTANT (local demo; production: POST /api/assistant) ===== */
$('#an').textContent=CONFIG.ASSISTANT_NAME;
const say=(h,c)=>{const m=document.createElement('div');m.className='m '+c;m.innerHTML=h;$('#msgs').append(m);$('#msgs').scrollTop=1e5};
const pc=l=>l.slice(0,3).map(p=>`<div class="mc">${img(p)}<div><b>${p.name}</b><div class="pr">${money(p.price)}</div><a class="btn sm" href="#/product/${p.slug}" style="min-height:34px">عرض المنتج</a> <button class="btn o sm" data-ap="${p.id}" style="min-height:34px">أضف</button></div></div>`).join('');
function ask(t){say(esc(t),'u');const q=norm(t),pn=(t.match(/\d+/)||[])[0];let r;
if(/فرع|فروع|وين|اين|عنوان/.test(q)&&!/عطر|منتج/.test(q))r='📍 '+CONFIG.BRANCHES.map(b=>b.name+'\n<a href="'+mapUrl(b)+'" target="_blank" rel="noopener"><u>'+b.addr+'</u></a>').join('\n\n📍 ');
else if(/كيف.*اطلب|الطلب|اطلب/.test(q)&&!pn)r='1. اختر المنتجات.\n2. أضفها إلى السلة.\n3. أدخل بياناتك.\n4. اضغط «تأكيد الطلب».\n5. سيتم استلام الطلب والتواصل معك لتأكيد التفاصيل.';
else if(/عروض|خصم/.test(q))r='تجد العروض هنا: <a href="#/offers"><u>صفحة العروض</u></a>';
else if(/استرجاع|استبدال/.test(q))r='تجد التفاصيل هنا: <a href="#/returns"><u>الاستبدال والاسترجاع</u></a>';
else if(/تواصل|هاتف|واتساب|رقم/.test(q))r='الهاتف: '+CONFIG.STORE_PHONE+'\nواتساب: '+CONFIG.WHATSAPP_DISPLAY+'\n<a href="#/contact"><u>صفحة التواصل</u></a>';
else if(/توصيل|شحن/.test(q))r='يتم تأكيد تكلفة التوصيل مع العميل بعد إرسال الطلب.';
else{let l=[];const kw=q.split(/\s+/).filter(w=>w.length>2&&!/اريد|عايز|ابحث|عن|ساعدني|في|حدود|جنيه/.test(w));kw.forEach(w=>find(w).forEach(p=>!l.includes(p)&&l.push(p)));
if(/عطر/.test(q)&&!l.length)l=PRODUCTS.filter(p=>p.cat==='perfumes');if(/سودان/.test(q))l=PRODUCTS.filter(p=>p.cat==='sudanese-products');
if(pn)l=l.filter(p=>p.price<=+pn);
if(l.length)r='يسعدني ترشيح هذه المنتجات من الكتالوج الحالي:'+pc(l);
else if(/هدي/.test(q))r='يسعدني مساعدتك. هل تفضل عطرًا نسائيًا، أم منتجًا من منتجات العناية والجمال؟';
else if(/عطر|اختيار|ساعد/.test(q))r='بكل سرور. هل تفضل رائحة شرقية دافئة، أم رائحة أكثر هدوءًا وانتعاشًا؟';
else r='لا أملك هذه المعلومة حاليًا، ويمكنك التواصل مع فريق الجيلاني للتأكد منها.'}
setTimeout(()=>say(r,'b'),450)}
$('#chips').innerHTML=['ساعدني في اختيار عطر','ما المنتجات السودانية؟','أين فروعكم؟','كيف أطلب؟','أريد هدية'].map(c=>`<button type="button">${c}</button>`).join('');
$('#chips').onclick=e=>{if(e.target.tagName==='BUTTON')ask(e.target.textContent)};
$('#cf').onsubmit=e=>{e.preventDefault();const v=$('#ci').value.trim();if(v){$('#ci').value='';ask(v)}};
$('#ai').onclick=()=>{$('#chat').classList.toggle('on');if(!$('#msgs').children.length)say('مرحبًا بك في '+CONFIG.STORE_NAME+'. أنا '+CONFIG.ASSISTANT_NAME+'، يسعدني مساعدتك في اختيار ما يناسبك.','b')};$('#cx').onclick=()=>$('#chat').classList.remove('on');
document.querySelectorAll('[data-logo]').forEach(i=>i.src=IMG.logo);{const l=document.createElement('link');l.rel='icon';l.href=IMG.logo;document.head.append(l)}
render();
</script>
</body>
